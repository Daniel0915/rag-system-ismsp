<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>06. 멀티포맷 RAG</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <header>
    <h1>06. 멀티포맷 RAG (+ 이미지 OCR)</h1>
    <a href="/">&larr; 전체 모듈</a>
  </header>
  <main>
    <section class="step">
      <h2>파일 업로드 (PDF/CSV/TXT/MD/DOCX/PPTX/이미지)</h2>
      <p class="muted">샘플: <code>samples/sample.csv</code>, <code>samples/rag_test_02_contract.png</code> 등</p>
      <input type="file" id="file-input" multiple accept=".pdf,.csv,.txt,.md,.docx,.pptx,.jpg,.jpeg,.png,.gif,.bmp,.webp" />
      <button id="upload-btn">업로드</button>
      <div class="result" id="upload-result"></div>
    </section>

    <section class="step">
      <h2>문서 관리</h2>
      <button id="refresh-files-btn">문서 목록 새로고침</button>
      <button id="delete-all-btn" style="background:#a33">전체 삭제</button>
      <div id="file-list"></div>
    </section>

    <section class="step">
      <h2>통합 채팅</h2>
      <div class="chat-log" id="chat-log"></div>
      <input type="text" id="chat-input" placeholder="문서에 대해 질문하세요..." />
      <button id="chat-send">전송</button>
      <div class="two-col">
        <div>
          <h3 class="muted">출처</h3>
          <div id="sources"></div>
        </div>
        <div class="pdf-viewer">
          <h3 class="muted">페이지 미리보기 (PDF만 지원)</h3>
          <img id="page-image" style="display:none" />
        </div>
      </div>
    </section>
  </main>
  <script src="/06-rag-multi-format/script.js"></script>
</body>
</html>
