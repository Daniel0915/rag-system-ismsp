<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>07. LangGraph 기초</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <header>
    <h1>07. LangGraph 기초</h1>
    <a href="/">&larr; 전체 모듈</a>
  </header>
  <main>
    <section class="step">
      <h2>Step 1 — 선형 그래프 (분석 → 답변)</h2>
      <label>질문</label>
      <input type="text" id="s1-question" value="블랙홀이 뭔가요?" />
      <button id="s1-btn">실행</button>
      <div class="result" id="s1-result"></div>
    </section>

    <section class="step">
      <h2>Step 2 — 조건 분기 (factual / opinion / creative)</h2>
      <label>질문</label>
      <input type="text" id="s2-question" value="아이폰과 갤럭시를 비교해줘" />
      <button id="s2-btn">실행</button>
      <div class="result" id="s2-result"></div>
    </section>

    <section class="step">
      <h2>Step 3 — 루프 그래프 (작성 → 평가 → 재작성)</h2>
      <label>주제</label>
      <input type="text" id="s3-topic" value="인공지능이 바꿀 미래" />
      <label>최대 반복 횟수</label>
      <input type="number" id="s3-max" value="3" min="1" max="5" />
      <button id="s3-btn">실행</button>
      <div class="result" id="s3-result"></div>
    </section>

    <section class="step">
      <h2>Step 4 — RAG + 평가자 재검색 루프</h2>
      <p class="muted">
        예시(2-hop 브릿지): "NovaCore 프로세서를 만든 회사의 작년 매출은 얼마인가요?" —
        k=2 검색이라 첫 검색에서는 NovaCore↔Qubrix 연결만 찾고, 재검색으로 매출 정보를 추가로 찾아야 합니다.
      </p>
      <label>질문</label>
      <input type="text" id="s4-question" value="NovaCore 프로세서를 만든 회사의 작년 매출은 얼마인가요?" />
      <label>최대 반복 횟수</label>
      <input type="number" id="s4-max" value="3" min="1" max="5" />
      <button id="s4-btn">실행</button>
      <div class="result" id="s4-result"></div>
    </section>
  </main>
  <script src="/07-langgraph-basics/script.js"></script>
</body>
</html>
